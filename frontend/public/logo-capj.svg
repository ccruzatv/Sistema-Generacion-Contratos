<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" fill="#1a3592">
  <!-- ========== PEDIMENT (ROOF) ========== -->
  <!-- Outer triangle -->
  <polygon points="180,12 18,108 342,108"/>
  <!-- Inner triangle cutout for depth -->
  <polygon points="180,30 42,102 318,102" fill="#ffffff"/>
  <!-- Inner filled triangle (slightly smaller) -->
  <polygon points="180,34 48,100 312,100" fill="#1a3592"/>
  <!-- Ridge line at top -->
  <line x1="180" y1="12" x2="180" y2="34" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>

  <!-- ========== TOP ENTABLATURE (main beam) ========== -->
  <rect x="18" y="108" width="324" height="14" rx="0"/>
  <!-- Beam detail line -->
  <rect x="18" y="120" width="324" height="3" fill="#ffffff" opacity="0.15"/>

  <!-- ========== COLONNADE DETAILS (small pillars between figures) ========== -->
  <!-- Left group of small columns -->
  <rect x="100" y="126" width="3.5" height="96" fill="#1a3592"/>
  <rect x="108" y="126" width="3.5" height="96" fill="#1a3592"/>
  <rect x="116" y="126" width="3.5" height="96" fill="#1a3592"/>
  <rect x="124" y="126" width="3.5" height="96" fill="#1a3592"/>
  <rect x="132" y="126" width="3.5" height="96" fill="#1a3592"/>
  <!-- Right group of small columns -->
  <rect x="224" y="126" width="3.5" height="96" fill="#1a3592"/>
  <rect x="232" y="126" width="3.5" height="96" fill="#1a3592"/>
  <rect x="240" y="126" width="3.5" height="96" fill="#1a3592"/>
  <rect x="248" y="126" width="3.5" height="96" fill="#1a3592"/>
  <rect x="256" y="126" width="3.5" height="96" fill="#1a3592"/>

  <!-- ========== LEFT OUTER PILLAR ========== -->
  <rect x="30" y="124" width="22" height="100"/>
  <!-- Pillar highlight -->
  <rect x="36" y="124" width="4" height="100" fill="#ffffff" opacity="0.08"/>

  <!-- ========== RIGHT OUTER PILLAR ========== -->
  <rect x="308" y="124" width="22" height="100"/>
  <!-- Pillar highlight -->
  <rect x="314" y="124" width="4" height="100" fill="#ffffff" opacity="0.08"/>

  <!-- ========== LEFT CARYATID (female figure) ========== -->
  <!-- Head -->
  <ellipse cx="82" cy="140" rx="12" ry="13"/>
  <!-- Hair/crown detail -->
  <ellipse cx="82" cy="133" rx="10" ry="5" fill="#1a3592"/>
  <!-- Neck -->
  <rect x="77" y="152" width="10" height="6"/>
  <!-- Shoulders -->
  <path d="M67,158 Q67,155 72,155 L92,155 Q97,155 97,158 L97,164 L67,164 Z"/>
  <!-- Torso -->
  <rect x="69" y="164" width="26" height="24"/>
  <!-- Arms crossed on chest -->
  <path d="M69,164 Q65,170 66,178 L69,178 L72,168 Z" fill="#1a3592"/>
  <path d="M95,164 Q99,170 98,178 L95,178 L92,168 Z" fill="#1a3592"/>
  <!-- Dress/robe lower portion -->
  <path d="M67,188 L67,224 L97,224 L97,188 Z"/>
  <!-- Dress fold lines -->
  <line x1="74" y1="188" x2="74" y2="224" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
  <line x1="82" y1="185" x2="82" y2="224" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
  <line x1="90" y1="188" x2="90" y2="224" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
  <!-- Base of figure -->
  <rect x="65" y="220" width="34" height="4" rx="1"/>

  <!-- ========== RIGHT CARYATID (female figure) ========== -->
  <!-- Head -->
  <ellipse cx="278" cy="140" rx="12" ry="13"/>
  <!-- Hair/crown detail -->
  <ellipse cx="278" cy="133" rx="10" ry="5" fill="#1a3592"/>
  <!-- Neck -->
  <rect x="273" y="152" width="10" height="6"/>
  <!-- Shoulders -->
  <path d="M263,158 Q263,155 268,155 L288,155 Q293,155 293,158 L293,164 L263,164 Z"/>
  <!-- Torso -->
  <rect x="265" y="164" width="26" height="24"/>
  <!-- Arms crossed on chest -->
  <path d="M265,164 Q261,170 262,178 L265,178 L268,168 Z" fill="#1a3592"/>
  <path d="M291,164 Q295,170 294,178 L291,178 L288,168 Z" fill="#1a3592"/>
  <!-- Dress/robe lower portion -->
  <path d="M263,188 L263,224 L293,224 L293,188 Z"/>
  <!-- Dress fold lines -->
  <line x1="270" y1="188" x2="270" y2="224" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
  <line x1="278" y1="185" x2="278" y2="224" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
  <line x1="286" y1="188" x2="286" y2="224" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
  <!-- Base of figure -->
  <rect x="261" y="220" width="34" height="4" rx="1"/>

  <!-- ========== BOTTOM ENTABLATURE ========== -->
  <rect x="18" y="224" width="324" height="12" rx="0"/>

  <!-- ========== THREE-STEP BASE ========== -->
  <!-- Step 1 (widest) -->
  <rect x="6" y="270" width="348" height="16" rx="1"/>
  <!-- Step 2 (middle) -->
  <rect x="12" y="252" width="336" height="16" rx="1"/>
  <!-- Step 3 (top, narrowest of steps) -->
  <rect x="18" y="236" width="324" height="16" rx="0"/>
</svg>
